[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vsl-part3"
version = "0.1.0"
description = "Part 3 - Gamification Learning for Vietnamese Sign Language"
requires-python = ">=3.10"
dependencies = [
    "vslshared @ file:../shared",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
    "PyQt6>=6.6",
]

[tool.setuptools.packages.find]
include = ["part3_gamification*", "backend*", "frontend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]