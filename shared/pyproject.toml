[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vslshared"
version = "0.1.0"
description = "Shared core for the VSL ecosystem (keypoints, classifier, templates, db)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "mediapipe>=0.10",
]

[project.optional-dependencies]
ml = ["torch>=2.0", "scikit-learn>=1.2"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
include = ["vslshared*"]